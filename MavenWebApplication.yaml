apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: mavenreplicaset
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      env: dev
  template:
    metadata:
      name: maven-pod
      labels:
        env: dev
        name: mavenpod
    spec:
      containers:
      - name: maven-web-app
        image: saiteja043/maven-web-app:${BUILD_NUMBER}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mavensvc
  namespace: dev
spec:
  type: NodePort
  selector:
    env: dev
  ports:
  - port: 80
    targetPort: 8080
